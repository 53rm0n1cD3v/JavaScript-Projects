<!DOCTYPE html>
<html>
	<title>Boolean</title>
<body>


<p id="result"></p>
<script>
  let age = 20;
  let hasID = true;

  // AND operator: both must be true
  let canEnter = age >= 18 && hasID;  // true

  document.getElementById("result").textContent =
    "Can enter? " + canEnter;
</script>

</body>
</html>
