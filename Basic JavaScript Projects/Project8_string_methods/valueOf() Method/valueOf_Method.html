<!DOCTYPE html>
<html>
<head>
  <title>valueOf() Example</title>
</head>
<body>

  <h2>valueOf() Demo</h2>
  <p id="output"></p>

  <script>
    // Create a Number object
    const numObj = new Number(50);

    // Call valueOf()
    const result = numObj.valueOf();

    // Display result in the page
    document.getElementById("output").textContent =
      "The valueOf() result is: " + result;
  </script>

</body>
</html>
