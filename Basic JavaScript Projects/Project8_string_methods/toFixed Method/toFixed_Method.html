<!DOCTYPE html>
<html>
<head>
    <title>toFixed Example</title>
</head>
<body>
<h1>toFixed method</h1>

<script>
    let number = 12.98718;

    document.write("Original: " + number + "<br>");
    document.write("toFixed(2): " + number.toFixed(2) + "<br>");
    document.write("toFixed(0): " + number.toFixed(0) + "<br>");
    document.write("toFixed(4): " + number.toFixed(4));
</script>

</body>
</html>
