<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Countdown + Slideshow</title>
    <link rel="stylesheet" type="text/css" href="Countdown_Slideshow.css">
</head>

<body>

<p>How many seconds would you like to set your alarm for?</p>
<input id="seconds" value="" />
<button onclick="countdown()">Click here</button>
<p id="timer"></p>

<!-- Slideshow container -->
<div class="slideshow-container">

  <div class="mySlides fade">
    <div class="numbertext">Butterfly</div>
    <img src="Images/Butterfly1.jpg" style="width:100%">
    <div class="text">Nature</div>
  </div>

  <div class="mySlides fade">
    <div class="numbertext">Butterfly</div>
    <img src="Images/Butterfly2.jpg" style="width:100%">
    <div class="text">Nature</div>
  </div>

  <div class="mySlides fade">
    <div class="numbertext">Butterfly</div>
    <img src="Images/Butterfly3.jpg" style="width:100%">
    <div class="text">Nature</div>
  </div>

  <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
  <a class="next" onclick="plusSlides(1)">&#10095;</a>
</div>

<br>

<div style="text-align:center">
  <span class="dot" onclick="currentSlide(1)"></span>
  <span class="dot" onclick="currentSlide(2)"></span>
  <span class="dot" onclick="currentSlide(3)"></span>
</div>

<script src="Countdown_Slideshow.js"></script>

</body>
</html>
