<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Arrow Function Demo</title>
</head>
<body>

    <h1>Arrow Function Test</h1>

    <script>
        // Normal function (executed first)
        function greet() {
            console.log("Hello from a normal function!");
        }
        greet();

        // Arrow function (executed second)
        const greetArrow = () => {
            console.log("Hello from an arrow function!");
        };
        greetArrow();
    </script>

</body>
</html>
